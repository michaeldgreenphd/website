<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>That page has moved — Michael D. Green, PhD</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">

    <!-- Old root-level PDF links (shared before the files moved into cv/ and
         manuscripts/) are forwarded to their new home. Served by GitHub Pages
         at any depth, so every path here is absolute. -->
    <script>
        function resolveMovedPdf(pathname) {
            if (!/\.pdf$/i.test(pathname)) return null;
            if (pathname.indexOf('/', 1) !== -1) return null; // already inside a folder
            var name;
            try { name = decodeURIComponent(pathname.slice(1)); } catch (e) { return null; }
            return (/ CV\.pdf$/i.test(name) ? '/cv' : '/manuscripts') + pathname;
        }
        (function () {
            var target = resolveMovedPdf(location.pathname);
            if (target) location.replace(target);
        })();
    </script>

    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'DM Sans';
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url('/fonts/dm-sans-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Fraunces';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('/fonts/fraunces-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'IBM Plex Mono';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/ibm-plex-mono-400-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --ink: #1E5B40;
            --bg: #F4F6F2;
            --text: #16211C;
            --text-2: #566159;
            --line: #DBE2DC;
            --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
            --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --ink: #4FB784; --bg: #0F1E18; --text: #EDF2EE; --text-2: #B4C3B9; --line: #294034;
            }
        }
        :root[data-theme="dark"] {
            --ink: #4FB784; --bg: #0F1E18; --text: #EDF2EE; --text-2: #B4C3B9; --line: #294034;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--sans);
            font-size: 1rem;
            line-height: 1.72;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }
        .page { max-width: 46rem; margin: 0 auto; padding: 3.5rem 1.5rem 2rem; }
        h1 {
            font-family: var(--serif);
            font-weight: 600;
            font-size: clamp(1.9rem, 1.5rem + 2vw, 2.5rem);
            line-height: 1.12;
            letter-spacing: -0.018em;
        }
        p { max-width: 34rem; margin-top: 1rem; color: var(--text-2); }
        a { color: var(--ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--ink) 35%, transparent); text-underline-offset: 2px; }
        a:hover { text-decoration-color: var(--ink); }
        a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
        ul { list-style: none; margin-top: 1.4rem; }
        li { padding-left: 1.1rem; position: relative; margin-bottom: 0.55rem; }
        li::before { content: "–"; position: absolute; left: 0; color: var(--ink); }
        footer {
            margin-top: 3rem;
            padding: 1.4rem 0 0.5rem;
            border-top: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            color: var(--text-2);
        }
    </style>

    <script>
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (e) { /* storage unavailable */ }
    </script>
</head>
<body>
    <div class="page">
        <h1>That page has moved</h1>
        <p>The CV and paper PDFs now live in their own folders, so an older link may no longer land where it used to. Here is where to go instead:</p>
        <ul>
            <li><a href="/#cv">Current CV</a></li>
            <li><a href="/published-manuscripts.html">Published manuscripts</a></li>
            <li><a href="/">Home</a></li>
        </ul>
        <footer>&copy; 2026 Michael D. Green, PhD.</footer>
    </div>
</body>
</html>
